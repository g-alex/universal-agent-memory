name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    # Postgres with pgvector as a service container: integration tests hit
    # localhost:5432, same as locally (see tests/conftest.py)
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: memory
          POSTGRES_PASSWORD: memorypass
          POSTGRES_DB: memory_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memory -d memory_db"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests with coverage
        run: python -m pytest --cov=app --cov-report=term --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
